name: CI/CD Pipeline - Build, Scan & Push to ECR

on:
  push:
    branches: [ "main", "devops-setup" ]
  pull_request:
    branches: [ "main" ]

env:
  AWS_REGION: ap-southeast-1
  ECR_BACKEND: 374196135459.dkr.ecr.ap-southeast-1.amazonaws.com/prompt-engineer-agent-backend
  ECR_FRONTEND: 374196135459.dkr.ecr.ap-southeast-1.amazonaws.com/prompt-engineer-agent-frontend

jobs:
  backend-ci:
    name: Build & Push Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 1: Build the image locally first (load: true puts it in local docker daemon)
      - name: Build Backend Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: backend-local:${{ github.sha }}

      # Step 2: Scan the locally built image with Trivy
      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'backend-local:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # Step 3: Tag and Push to ECR after scan passes
      - name: Push Backend Image to ECR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_BACKEND }}:${{ github.sha }}
            ${{ env.ECR_BACKEND }}:latest

  frontend-ci:
    name: Build & Push Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 1: Build the image locally first
      - name: Build Frontend Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/frontend
          file: ./frontend/frontend/Dockerfile
          load: true
          tags: frontend-local:${{ github.sha }}

      # Step 2: Scan the locally built image with Trivy
      - name: Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'frontend-local:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      # Step 3: Tag and Push to ECR after scan passes
      - name: Push Frontend Image to ECR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/frontend
          file: ./frontend/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_FRONTEND }}:${{ github.sha }}
            ${{ env.ECR_FRONTEND }}:latest
